# ながおか探検録の Android 配布用ファイル（AAB）を GitHub 上で組み立てる。
#
# なぜクラウドで組むか：Mac にも Windows にも Android Studio / Java が入っていないため
# （柿川亭アプリ kakigawatei-app と同じやり方）。
#
# 使い方：Actions タブ →「Android AAB をビルド」→ Run workflow（または android-v* のタグを push）。
# 完成物は実行結果ページの Artifacts（nagaoka-android）からダウンロードできる。
#
# 署名：GitHub の Secrets に鍵を入れてある（リポジトリには置かない・公開リポジトリのため）。
#   NWALK_KEYSTORE_B64      … アップロード鍵 kakigawatei-upload.jks を base64 にしたもの
#   NWALK_KEYSTORE_PASSWORD … その鍵のパスワード（alias も同じパスワード）
#   Secrets が無いときは未署名で組む。

name: Android AAB をビルド

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 依存をインストール
        run: npm ci

      - name: www を作って Android に反映
        run: |
          node build-www.js
          npx cap sync android

      - name: 署名鍵を Secrets から復元（無ければ未署名）
        env:
          KS_B64: ${{ secrets.NWALK_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "NWALK_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "署名鍵あり: 署名付きで組みます"
          else
            echo "署名鍵なし: 未署名で組みます"
          fi

      - name: AAB を組み立てる
        env:
          NWALK_KEYSTORE_PASSWORD: ${{ secrets.NWALK_KEYSTORE_PASSWORD }}
          NWALK_KEY_ALIAS: kakigawatei-upload
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: 署名の確認
        run: |
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab)
          ls -l "$AAB"
          jarsigner -verify "$AAB" | tail -2 || true

      - name: 動作確認用のAPKも作る
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: nagaoka-android
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
