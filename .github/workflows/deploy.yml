name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # 2026-11-25: 公開の中身が 1.3GB になり Pages の上限 1GB を超えて deploy が失敗した。
      # 画面で使わない物（ig の動画＝投稿済みリール・tools＝作業用・android）を公開する荷物からだけ外す（ファイルは消さない）。
      - name: Make site folder (exclude large non-site files)
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude '.git' --exclude '.github' --exclude 'tools/' --exclude 'android/' \
            --exclude 'node_modules/' --exclude 'ig/*.mp4' --exclude 'ig/*.mov' ./ "$RUNNER_TEMP/site/"
          du -sh "$RUNNER_TEMP/site"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
