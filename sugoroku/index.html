<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ながおかスゴ録</title>
<style>
  :root{--ink:#2a2118;--paper:#f6f1e6;--accent:#d9552f;--gold:#e0b84a}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:"Yu Gothic","Hiragino Sans",sans-serif;-webkit-user-select:none;overflow:hidden}
  #wrap{position:relative;width:100%;height:100%;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #hud{position:absolute;left:0;right:0;top:0;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:14px;background:linear-gradient(rgba(246,241,230,.96),rgba(246,241,230,0));pointer-events:none}
  #hud b{font-size:18px}
  #dest{position:absolute;left:14px;right:14px;top:44px;font-size:13px;color:#5e5245;pointer-events:none}
  #panel{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#fffdf7;border-top:2px solid #e6dcc6;border-radius:18px 18px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.08)}
  #msg{min-height:40px;font-size:15px;line-height:1.5;margin-bottom:10px}
  .row{display:flex;gap:10px} .row + .row{margin-top:8px}
  button{flex:1;padding:13px 6px;border:none;border-radius:12px;font-size:15px;font-weight:700;background:var(--accent);color:#fff;box-shadow:0 3px 0 #a8391c;white-space:nowrap}
  #roll{flex:1.6}
  button:disabled{background:#cfc6b3;box-shadow:none;color:#fff}
  button.ghost{background:#fff;color:var(--ink);border:2px solid #e6dcc6;box-shadow:none}
  button.dir{background:#3b6fb6;box-shadow:0 3px 0 #24487a}
  #stock{font-size:13px;color:#7a6b58;margin-top:8px}
  .card{position:absolute;left:16px;right:16px;bottom:190px;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.18);display:none}
  .card h3{margin:0 0 6px;font-size:18px} .card p{margin:0 0 10px;font-size:14px;color:#5e5245}
</style></head>
<body><div id="wrap">
<canvas id="cv"></canvas>
<div id="hud"><div>🐑 <b id="money">1000</b> 万両</div><div id="date">1年目 4月</div></div>
<div id="dest"></div>
<div class="card" id="card"><h3 id="cTitle"></h3><p id="cBody"></p><div class="row"><button id="cBuy">買う</button><button class="ghost" id="cSkip">やめる</button></div></div>
<div id="panel"><div id="msg">サイコロを振って、長岡を旅しよう。分かれ道では行き先を選べます。</div>
<div class="row" id="dirs" style="display:none"></div>
<div class="row" id="hand" style="display:none"></div>
<div class="row"><button id="roll">🎲 サイコロ</button><button class="ghost" id="assets">物件</button><button class="ghost" id="rank">順位</button><button class="ghost" id="nameBtn">名前</button></div>
<div id="stock"></div></div>
</div>
<script src="data/board_v3.js"></script>
<script src="data/areas.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
/* ながおかスゴ録 v2（2026-09-10 ポム）— 桃鉄型の路線網。OSM の道路・鉄道に沿った 963 マス（data/board_v2.json→board_v2.js）
   ・サイコロ 60分に1回・3回まで貯まる／分かれ道で行き先を選ぶ／目的地（探検録のスポット）に着くとご褒美→次の目的地
   ・青=もらう 赤=払う 黄=カード（仮） 紫=イベント（仮） 緑=目的地 橙=物件（買える・自分のに止まると売上）
   ・絵はまだ無い（masa の image2.5 の地図とマス絵を後で敷く）。データは端末保存（Firestore 共有は次） */
const B = BOARD_DATA; const R = B.rules; const NODES = B.nodes; const byId = Object.fromEntries(NODES.map(n => [n.id, n]));
const ADJ = {}; B.edges.forEach(([a, b]) => { (ADJ[a] = ADJ[a] || []).push(b); (ADJ[b] = ADJ[b] || []).push(a); });
const START = NODES.find(n => n.station === "nagaoka_st").id;
const KEY = "nagaoka_sugoroku_v3";   // 盤面 v3（道路網を広げた）で保存を切り替え
const TURNS_PER_YEAR = 12 * (R.turnsPerMonth || 1) * 3;   // 1か月＝3手番（36手番で1年）。ルール値から一本化（デク指摘10）
const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch { return null; } };
const RIVALS = [{ id: "kon", name: "コン", icon: "🦊" }, { id: "kabuto", name: "愛の兜", icon: "⛑️" }, { id: "ryokan", name: "良寛さん", icon: "🧘" }];   // CPUの旅人（探検録の顔ぶれ）
const newRivals = () => RIVALS.map(r => ({ id: r.id, pos: START, prev: null, money: R.startMoney, owned: [], dest: null, reached: 0 }));
let S = load() || { pos: START, prev: null, money: R.startMoney, owned: [], dice: R.diceStockMax, lastDice: Date.now(), turn: 0, dest: null, reached: 0, log: [], cards: [], skip: 0, rivals: newRivals() };
if (!S.rivals) { S.rivals = newRivals(); S.cards = S.cards || []; S.skip = 0; }
/* ---- 共有盤面（Firestore）---- */
let FB = null, UID = null, OTHERS = {}, PROPS = {};   // OTHERS: 他の実プレイヤー / PROPS: 物件の持ち主 {propId: {owner, name}}
try { firebase.initializeApp({ apiKey: "AIzaSyDtDZIEQtBzjujnpTDcXt1QeEU2r-wbg74", authDomain: "kakigawatei-franchise.firebaseapp.com", projectId: "kakigawatei-franchise" }); FB = firebase.firestore(); } catch (e) { console.warn("firebase off", e); }
const ownerOf = pid => S.owned.includes(pid) ? "you" : (PROPS[pid] && PROPS[pid].owner && PROPS[pid].owner !== UID) ? "p:" + PROPS[pid].owner : (S.rivals.find(r => r.owned.includes(pid)) || {}).id || null;
const ownerName = o => o === "you" ? "あなた" : o && o.startsWith("p:") ? ((OTHERS[o.slice(2)] || {}).name || "旅人") : ((RIVALS.find(r => r.id === o) || {}).name || "");
async function cloudStart() { if (!FB) return; try {
    const cred = await firebase.auth().signInAnonymously(); UID = cred.user.uid;
    const ref = FB.collection("sugoroku_players").doc(UID); const snap = await ref.get();
    if (snap.exists) { const c = snap.data(); ["pos", "prev", "money", "owned", "dice", "lastDice", "turn", "dest", "reached", "cards", "skip", "komeInvest", "name", "destBonus"].forEach(k => { if (c[k] !== undefined) S[k] = c[k]; }); save(); }
    else await cloudPush();
    FB.collection("sugoroku_players").where("updatedAt", ">", Date.now() - 7 * 86400000).onSnapshot(q => { OTHERS = {}; q.forEach(d => { if (d.id !== UID) OTHERS[d.id] = d.data(); }); draw(); });
    FB.collection("sugoroku_props").onSnapshot(q => { PROPS = {}; q.forEach(d => { PROPS[d.id] = d.data(); }); draw(); hud(); });
    hud(); draw();
  } catch (e) { console.warn("cloud start failed", e); } }
let pushTimer = null;
function cloudPush() { if (!FB || !UID) return; clearTimeout(pushTimer); pushTimer = setTimeout(() => { const out = { updatedAt: Date.now(), name: S.name || "旅人" }; ["pos", "prev", "money", "owned", "dice", "lastDice", "turn", "dest", "reached", "cards", "skip", "komeInvest", "destBonus"].forEach(k => { if (S[k] !== undefined) out[k] = S[k]; }); FB.collection("sugoroku_players").doc(UID).set(out, { merge: true }).catch(e => console.warn("push", e)); }, 500); }
/* 物件を買う: 早い者勝ちをトランザクションで */
async function cloudBuy(propId) { if (!FB || !UID) return true; try { await FB.runTransaction(async tx => { const ref = FB.collection("sugoroku_props").doc(propId); const d = await tx.get(ref); if (d.exists && d.data().owner && d.data().owner !== UID) throw new Error("taken"); tx.set(ref, { owner: UID, name: S.name || "旅人", at: Date.now() }); }); return true; } catch (e) { return false; } }
const save = () => { localStorage.setItem(KEY, JSON.stringify(S)); cloudPush(); };
function refill() { const g = Math.floor((Date.now() - S.lastDice) / (R.diceCooldownMin * 60000)); if (g > 0) { S.dice = Math.min(R.diceStockMax, S.dice + g); S.lastDice += g * R.diceCooldownMin * 60000; if (S.dice >= R.diceStockMax) S.lastDice = Date.now(); save(); } }
/* 座標 → 画面: 緯度経度をメルカトルで平面に。カメラはコマを追う */
const cv = document.getElementById("cv"), ctx = cv.getContext("2d"); const DPR = devicePixelRatio || 1; let W, H;
const merc = n => ({ x: n.lng, y: -Math.log(Math.tan(Math.PI / 4 + n.lat * Math.PI / 360)) * 180 / Math.PI });
const P = Object.fromEntries(NODES.map(n => [n.id, merc(n)]));
let cam = { ...P[S.pos] }, zoom = 15000;   // 1度 ≒ 15000px（1マス≒200m が約 26px・絵の解像度に合わせて引き気味）
function layout() { W = cv.width = innerWidth * DPR; H = cv.height = innerHeight * DPR; }
const scr = p => ({ x: W / 2 + (p.x - cam.x) * zoom * DPR, y: H * 0.42 + (p.y - cam.y) * zoom * DPR });
const COL = { blue: "#4a7fd6", red: "#d9553a", yellow: "#e6c34a", event: "#9a6fd0", dest: "#3aa66a", prop: "#f08a1e", fork: "#fff" };
/* 絵の地図（実地形を塗り直したもの）: エリアごとに緯度経度の枠 → メルカトル矩形に貼る */
const AREAS = (typeof AREA_DATA !== "undefined") ? AREA_DATA : {};
const AIMG = {}; Object.keys(AREAS).forEach(k => { const im = new Image(); im.src = `areas/${k}.jpg`; im.onload = () => draw(); AIMG[k] = im; });
const mercY = lat => -Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)) * 180 / Math.PI;
/* 描く順: 全体図 → エリア → 高解像度タイル（キー "aNN_tXY"）。後に描くほど上 */
const AKEYS = Object.keys(AREAS).sort((a, b) => (a === "overview" ? -1 : b === "overview" ? 1 : a.includes("_t") - b.includes("_t") || a.localeCompare(b)));
function drawAreas() { AKEYS.forEach(k => { const a = AREAS[k], im = AIMG[k]; if (!im || !im.complete || !im.naturalWidth) return;
    const tl = scr({ x: a.lon_left, y: mercY(a.lat_top) }), br = scr({ x: a.lon_right, y: mercY(a.lat_bottom) });
    if (br.x < 0 || tl.x > W || br.y < 0 || tl.y > H) return; ctx.drawImage(im, tl.x, tl.y, br.x - tl.x, br.y - tl.y); }); }
function draw(tokenPos) { ctx.clearRect(0, 0, W, H); ctx.fillStyle = "#efe8d8"; ctx.fillRect(0, 0, W, H); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high"; drawAreas();
  ctx.lineWidth = 10 * DPR; ctx.strokeStyle = "rgba(255,250,235,0.85)"; ctx.lineCap = "round";
  B.edges.forEach(([a, b]) => { const pa = scr(P[a]), pb = scr(P[b]); if (Math.max(pa.x, pb.x) < -50 || Math.min(pa.x, pb.x) > W + 50 || Math.max(pa.y, pb.y) < -50 || Math.min(pa.y, pb.y) > H + 50) return; ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke(); });
  NODES.forEach(n => { const p = scr(P[n.id]); if (p.x < -40 || p.x > W + 40 || p.y < -40 || p.y > H + 40) return; const big = n.t === "dest" || n.t === "prop"; const mine = n.prop && S.owned.includes(n.prop);
    const owner = n.prop ? ownerOf(n.prop) : null;
    ctx.beginPath(); ctx.arc(p.x, p.y, (big ? 11 : 7) * DPR, 0, 7); ctx.fillStyle = owner === "you" ? "#e0b84a" : owner ? "#9c8bd6" : COL[n.t] || "#fff"; ctx.fill(); ctx.lineWidth = 3 * DPR; ctx.strokeStyle = S.dest === n.id ? "#d9552f" : "#6b5b48"; ctx.stroke();
    if (big) { ctx.fillStyle = "#2a2118"; ctx.font = `${11 * DPR}px sans-serif`; ctx.textAlign = "center"; ctx.fillText((n.name || "").replace(/（.*?）|／.*$/g, "").slice(0, 9), p.x, p.y + 26 * DPR); } });
  Object.values(OTHERS).forEach(o => { if (o.pos === undefined || !P[o.pos]) return; const q = scr(P[o.pos]); if (q.x < -60 || q.x > W + 60 || q.y < -60 || q.y > H + 60) return; ctx.font = `${22 * DPR}px sans-serif`; ctx.textAlign = "center"; ctx.fillText("🐑", q.x + 12 * DPR, q.y - 24 * DPR); });
  S.rivals.forEach((r, i) => { const q = scr(P[r.pos]); if (q.x < -60 || q.x > W + 60 || q.y < -60 || q.y > H + 60) return; ctx.font = `${26 * DPR}px sans-serif`; ctx.textAlign = "center"; ctx.fillText(RIVALS[i].icon, q.x + (i - 1) * 14 * DPR, q.y - 30 * DPR); });
  const p = scr(tokenPos || P[S.pos]); ctx.font = `${36 * DPR}px sans-serif`; ctx.textAlign = "center"; ctx.fillText("🦙", p.x, p.y - 8 * DPR); }
addEventListener("resize", () => { layout(); draw(); });
/* 指でドラッグして地図を見回す（サイコロを振るとコマに戻る） */
let drag = null; cv.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y }; });
cv.addEventListener("pointermove", e => { if (!drag) return; cam.x = drag.cx - (e.clientX - drag.x) / zoom; cam.y = drag.cy - (e.clientY - drag.y) / zoom; draw(); });
cv.addEventListener("pointerup", () => drag = null); cv.addEventListener("pointercancel", () => drag = null);
const $ = id => document.getElementById(id); let busy = false;
const stName = n => (n.name || (n.t === "dest" ? n.station : "")).replace(/（.*?）|／.*$/g, "");
function hops(from, to) { const q = [from], d = { [from]: 0 }; while (q.length) { const u = q.shift(); if (u === to) return d[u]; for (const v of ADJ[u] || []) if (d[v] === undefined) { d[v] = d[u] + 1; q.push(v); } } return 999; }
const destBonus = hp => 200 + 30 * Math.min(hp, 40) + 50 * S.reached;   // マス間隔 700m に合わせて距離の重みを上げた   // 遠いほど高い（デク提案4）
function pickDest() { const cands = NODES.filter(n => n.t === "dest" && n.id !== S.pos && n.id !== S.dest); S.dest = cands[Math.floor(Math.random() * cands.length)].id; S.destBonus = destBonus(hops(S.pos, S.dest)); }
let hud = function () { if (!S.dest) pickDest(); $("money").textContent = S.money; const y = 1 + Math.floor(S.turn / TURNS_PER_YEAR), m = 4 + Math.floor((S.turn % TURNS_PER_YEAR) / (TURNS_PER_YEAR / 12)); $("date").textContent = `${y}年目 ${m > 12 ? m - 12 : m}月`;
  const hp = hops(S.pos, S.dest); $("dest").textContent = `🎯 目的地: ${stName(byId[S.dest])}（${byId[S.dest].area || ""}）　あと約 ${hp} マス・ご褒美 ${S.destBonus || destBonus(hp)}万両`; const wait = Math.max(0, R.diceCooldownMin * 60000 - (Date.now() - S.lastDice));
  $("stock").textContent = `サイコロ ${S.dice}/${R.diceStockMax}` + (S.dice < R.diceStockMax ? `　次まで ${Math.ceil(wait / 60000)}分` : ""); $("roll").disabled = S.dice <= 0 || busy || $("card").style.display === "block"; }
async function tween(a, b) { for (let t = 0; t <= 1.001; t += 0.125) { const p = { x: P[a].x + (P[b].x - P[a].x) * t, y: P[a].y + (P[b].y - P[a].y) * t }; cam.x += (p.x - cam.x) * 0.5; cam.y += (p.y - cam.y) * 0.5; draw(p); await new Promise(r => setTimeout(r, 22)); } }
function dirName(from, to) { const dx = P[to].x - P[from].x, dy = P[to].y - P[from].y; return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "東へ" : "西へ") : (dy > 0 ? "南へ" : "北へ"); }
function chooseDir(opts) { return new Promise(res => { const box = $("dirs"); box.innerHTML = ""; box.style.display = "flex"; opts.forEach(o => { const b = document.createElement("button"); b.className = "dir"; const h = hops(o.to, S.dest), h0 = hops(S.pos, S.dest); b.textContent = "→ " + (stName(byId[o.to]) || dirName(S.pos, o.to)) + (o.to === S.dest ? " 🎯" : h < h0 ? " 🎯近づく" : " 遠回り"); b.onclick = () => { box.style.display = "none"; res(o.to); }; box.appendChild(b); }); }); }
async function roll() { refill(); if (S.dice <= 0 || busy) return; busy = true; S.dice--; if (S.dice === R.diceStockMax - 1) S.lastDice = Date.now(); save();
  if (S.skip > 0) { S.skip--; $("msg").textContent = "1回休み。雪かきをして過ごした。"; rivalsMove(); save(); busy = false; hud(); draw(); return; }
  let d = 1 + Math.floor(Math.random() * 6); if (S.double) { const d2 = 1 + Math.floor(Math.random() * 6); $("msg").textContent = `🎲🎲 ${d}＋${d2}＝${d + d2}！`; d += d2; S.double = false; } else $("msg").textContent = `🎲 ${d} が出た！`; hud(); cam = { ...P[S.pos] }; draw();
  let steps = d, prev = S.prev;
  while (steps > 0) { let nexts = (ADJ[S.pos] || []).filter(x => x !== prev); if (!nexts.length) nexts = ADJ[S.pos];
    let to = nexts[0];
    if (nexts.length > 1) { if (S.guide > 0) { const D = P[S.dest]; nexts.sort((a, b) => Math.hypot(P[a].x - D.x, P[a].y - D.y) - Math.hypot(P[b].x - D.x, P[b].y - D.y)); to = nexts[0]; S.guide--; } else { $("msg").textContent = `分かれ道。残り ${steps} マス。どちらへ？`; to = await chooseDir(nexts.map(x => ({ to: x }))); } }
    await tween(S.pos, to); prev = S.pos; S.pos = to; steps--; if (S.pos === S.dest) break; }
  S.prev = prev; S.turn++; draw(); arrive(); rivalsMove(); save(); busy = false; hud(); }
/* ---- ライバル（CPU）: プレイヤーが振るたびに1〜6歩。分岐は目的地に近づく方へ。物件に止まると買う ---- */
function rivalsMove() { if (S.rivalSkip > 0) { S.rivalSkip--; return; }
  S.rivals.forEach((r, i) => { if (!r.dest || r.dest === r.pos) { const c = NODES.filter(n => n.t === "dest" && n.id !== r.pos); r.dest = c[Math.floor(Math.random() * c.length)].id; }
    let steps = 1 + Math.floor(Math.random() * 6), prev = r.prev;
    while (steps-- > 0) { let nx = (ADJ[r.pos] || []).filter(x => x !== prev); if (!nx.length) nx = ADJ[r.pos]; const D = P[r.dest]; nx.sort((a, b) => Math.hypot(P[a].x - D.x, P[a].y - D.y) - Math.hypot(P[b].x - D.x, P[b].y - D.y)); const to = Math.random() < 0.8 ? nx[0] : nx[Math.floor(Math.random() * nx.length)]; prev = r.pos; r.pos = to; if (r.pos === r.dest) break; }
    r.prev = prev; const n = byId[r.pos];
    if (r.pos === r.dest) { r.money += 300 + 50 * r.reached; r.reached++; r.dest = null; }
    if (n.prop) { const pr = pv(n.prop), o = ownerOf(n.prop); if (!o && r.money >= pr.price && Math.random() < 0.7) { r.money -= pr.price; r.owned.push(n.prop); S.log.push(`${RIVALS[i].name} が ${pr.name} を買った`); }
      else if (o === "you") { const toll = income(pr, "you"); r.money = Math.max(0, r.money - toll); S.money += toll; S.log.push(`${RIVALS[i].name} が ${pr.name} で通行料 ${toll}万両`); } }
    else if (n.t === "blue") r.money += 40; else if (n.t === "red") r.money = Math.max(0, r.money - 30); }); }
/* ---- 黄マスのカード ---- */
const CARDS = [
  { id: "hegisoba", name: "へぎそばカード", desc: "次のサイコロを2個振れる", use: () => { S.double = true; } },
  { id: "koi", name: "錦鯉カード", desc: "次の分かれ道2回は目的地に近い方へ自動で進む", use: () => { S.guide = 2; } },
  { id: "kome", name: "米百俵カード", desc: "持っている間、青マスの実入り1.5倍（学びは財産）", use: () => { S.kome = true; } },
  { id: "abura", name: "あぶらげカード", desc: "所持金 +200万両", use: () => { S.money += 200; } },
  { id: "yuki", name: "雪おろしカード", desc: "ライバル全員を1回休みに", use: () => { S.rivalSkip = 1; } },
];
function giveCard() { const c = CARDS[Math.floor(Math.random() * CARDS.length)]; if (S.cards.length >= 4) { $("msg").textContent = "黄マス。でも手札がいっぱい（4枚まで）。"; return; } S.cards.push(c.id); $("msg").textContent = `黄マス。${c.name} を手に入れた！（${c.desc}）`; }
function useCard(idx) { const c = CARDS.find(x => x.id === S.cards[idx]); if (!c) return; c.use(); S.cards.splice(idx, 1); $("msg").textContent = `${c.name} を使った。${c.desc}`; save(); hud(); }
/* ---- 紫マスの長岡イベント ---- */
const EVENTS = [
  { name: "長岡花火", text: "夜空に正三尺玉。観光の物件を持っていれば売上×2（+{v}万両）", f: () => { const v = S.owned.filter(id => pv(id).kind === "観光").reduce((a, id) => a + Math.round(pv(id).price * pv(id).yield), 0); S.money += v; return v; } },
  { name: "豪雪", text: "山側は大雪。次は1回休み", f: () => { S.skip = 1; return 0; } },
  { name: "雲海", text: "山古志の雲海に感動。+150万両", f: () => { S.money += 150; return 150; } },
  { name: "灯籠流し", text: "柿川に灯籠を流した。徳が上がり、目的地のご褒美が増える", f: () => { S.reached += 2; return 0; } },
  { name: "闘牛", text: "牛の角突きに賭けた。{v}万両", f: () => { const w = Math.random() < 0.5; const v = w ? 200 : -100; S.money = Math.max(0, S.money + v); return v; } },
  { name: "良寛さんに会う", text: "所持金の1割を分けた（{v}万両）。次の青マスで倍になって返ってくる", f: () => { const v = Math.round(S.money * 0.1); S.money -= v; S.ryokan = v * 2; return -v; } },
];
function runEvent() { const e = EVENTS[Math.floor(Math.random() * EVENTS.length)]; const v = e.f(); $("msg").textContent = `🎆 ${e.name}: ${e.text.replace("{v}", v)}`; }
const pv = id => B.properties.find(q => q.id === id);
/* 季節増収（デク提案6）: 物件の種類 × 月。花火館は8月×3、酒蔵は冬×2、海の市場は夏×1.5、温泉は冬×2、闘牛は5月・9月×2、アルパカは春×1.5 */
function monthNow() { const m = 4 + Math.floor((S.turn % TURNS_PER_YEAR) / (TURNS_PER_YEAR / 12)); return m > 12 ? m - 12 : m; }
function seasonMul(pr) { const m = monthNow(); const id = pr.id;
  if (pr.name === "はなび館") return m === 8 ? 3 : 1;
  if (pr.kind === "酒蔵" || pr.kind === "醸造") return [12, 1, 2].includes(m) ? 2 : 1;
  if (pr.kind === "市場") return [7, 8].includes(m) ? 1.5 : 1;
  if (pr.kind === "宿") return [12, 1, 2].includes(m) ? 2 : 1;
  if (pr.name === "うし相撲場") return [5, 9].includes(m) ? 2 : 1;
  if (pr.name === "アルパカぼくじょう") return [4, 5].includes(m) ? 1.5 : 1;
  return 1; }
/* エリア独占: 同じ駅エリアの物件を全部持つと収益2倍 */
const areaOf = pr => (B.stations.find(st => st.id === pr.station) || {}).area || pr.station;
function monopoly(pr, who) { const same = B.properties.filter(q => areaOf(q) === areaOf(pr)); return same.length > 1 && same.every(q => ownerOf(q.id) === who); }
function income(pr, who) { let v = Math.round(pr.price * pr.yield * seasonMul(pr)); if (monopoly(pr, who)) v *= 2; if (who === "you" && S.komeInvest) v = Math.round(v * (1 + 0.05 * S.komeInvest)); return v; }
function total() { return S.money + S.owned.reduce((a, id) => a + pv(id).price, 0); }
function arrive() { const n = byId[S.pos]; const prop = n.prop ? pv(n.prop) : null;
  if (S.pos === S.dest) { const bonus = S.destBonus || destBonus(0); S.money += bonus; S.reached++; pickDest(); $("msg").textContent = `🎯 目的地 ${stName(n)} に到着！ ご褒美 +${bonus}万両　次は ${stName(byId[S.dest])}`; }
  const owner = prop ? ownerOf(prop.id) : null;
  if (prop && owner && owner !== "you") { const toll = income(prop, owner); S.money = Math.max(0, S.money - toll); const rv = S.rivals.find(r => r.id === owner); if (rv) rv.money += toll; $("msg").textContent = `${ownerName(owner)} の ${prop.name}。通行料 −${toll}万両`; return; }
  if (prop && !owner) { $("cTitle").textContent = `${prop.name}（${prop.kind}）`; $("cBody").textContent = `価格 ${prop.price}万両・年の実り ${Math.round(prop.yield * 100)}%${prop.note ? "・" + prop.note : ""}`; $("cBuy").disabled = S.money < prop.price; $("card").style.display = "block";
    $("cBuy").onclick = async () => { $("cBuy").disabled = true; const ok = await cloudBuy(prop.id); if (!ok) { $("card").style.display = "none"; $("msg").textContent = `${prop.name} は一足先に別の旅人が買ってしまった！`; hud(); return; } S.money -= prop.price; S.owned.push(prop.id); $("card").style.display = "none"; $("msg").textContent = `${prop.name} はあなたのもの！`; save(); draw(); hud(); };
    $("cSkip").onclick = () => { $("card").style.display = "none"; hud(); }; return; }
  if (prop) { const inc = income(prop, "you"); const mul = seasonMul(prop); S.money += inc; $("msg").textContent = `自分の ${prop.name} に到着。売上 +${inc}万両` + (mul > 1 ? `（${monthNow()}月の書き入れ時 ×${mul}）` : "") + (monopoly(prop, "you") ? "（独占 ×2）" : ""); return; }
  if (S.pos === S.dest) return;
  if (n.station === "kome100" && S.money >= 200 && (S.komeInvest || 0) < 5) { $("cTitle").textContent = "米百俵（学びへの投資）"; $("cBody").textContent = `いま200万両を出すと、以後すべての物件の収益 +5%（いま ${S.komeInvest || 0}口・最大5口）。食えないからこそ、学びに。`; $("cBuy").textContent = "200万両を出す"; $("cBuy").disabled = false; $("card").style.display = "block";
    $("cBuy").onclick = () => { S.money -= 200; S.komeInvest = (S.komeInvest || 0) + 1; $("card").style.display = "none"; $("cBuy").textContent = "買う"; $("msg").textContent = `米百俵の学び ${S.komeInvest}口。物件の収益 +${5 * S.komeInvest}%`; save(); hud(); };
    $("cSkip").onclick = () => { $("card").style.display = "none"; $("cBuy").textContent = "買う"; hud(); }; return; }
  if (n.t === "blue") { let v = 20 + Math.floor(Math.random() * 8) * 10; if (S.kome) v = Math.round(v * 1.5); if (S.ryokan) { v += S.ryokan; S.ryokan = 0; } S.money += v; $("msg").textContent = `青マス。+${v}万両`; }
  else if (n.t === "red") { const v = Math.min(S.money, 10 + Math.floor(Math.random() * 6) * 10); S.money -= v; $("msg").textContent = `赤マス。−${v}万両`; }
  else if (n.t === "yellow") giveCard();
  else if (n.t === "event") runEvent();
  else if (n.t === "dest") { $("msg").textContent = `${stName(n)}（${n.area || ""}）を通過。`; }
  if (S.turn % TURNS_PER_YEAR === 0 && S.owned.length) { const y = S.owned.reduce((a, id) => a + income(pv(id), "you"), 0); S.money += y; $("msg").textContent += `　年の決算 +${y}万両`; } }
$("roll").onclick = roll;
$("nameBtn").onclick = () => { const v = prompt("旅人の名前（順位や物件に出ます）", S.name || ""); if (v !== null) { S.name = v.trim().slice(0, 12) || "旅人"; save(); $("msg").textContent = `名前を「${S.name}」にした。`; } };
function renderHand() { const box = $("hand"); box.innerHTML = ""; if (!S.cards.length) { box.style.display = "none"; return; } box.style.display = "flex"; S.cards.forEach((id, i) => { const c = CARDS.find(x => x.id === id); const b = document.createElement("button"); b.className = "ghost"; b.style.fontSize = "13px"; b.textContent = c.name; b.title = c.desc; b.onclick = () => { if (busy) return; useCard(i); renderHand(); }; box.appendChild(b); }); }
$("rank").onclick = () => { const rows = [{ name: "あなた", total: total() }].concat(Object.values(OTHERS).map(o => ({ name: o.name || "旅人", total: (o.money || 0) + (o.owned || []).reduce((a, id) => a + (pv(id) ? pv(id).price : 0), 0) }))).concat(S.rivals.map((r, i) => ({ name: RIVALS[i].name, total: r.money + r.owned.reduce((a, id) => a + pv(id).price, 0) }))).sort((a, b) => b.total - a.total); $("msg").textContent = "総資産: " + rows.map((r, i) => `${i + 1}位 ${r.name} ${r.total}`).join("　"); };
const _hud = hud; hud = function () { _hud(); renderHand(); };
$("assets").onclick = () => { const l = S.owned.map(id => pv(id).name); $("msg").textContent = l.length ? "持ち物件: " + l.join("、") + `　／ 総資産 ${total()}万両` : "まだ物件はありません。"; };
refill(); const today = new Date().toDateString(); if (S.dice >= R.diceStockMax && S.lastGift !== today) { S.lastGift = today; S.money += 50; save(); setTimeout(() => { $("msg").textContent = "☀ 朝市ボーナス +50万両（サイコロが満タンの日に開くともらえる）"; }, 300); }
layout(); hud(); draw(); setInterval(() => { refill(); hud(); }, 30000); cloudStart();
</script>
