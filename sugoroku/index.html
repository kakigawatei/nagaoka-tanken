<!doctype html>

<title>ながおかスゴ録</title>

<script>
/* ながおかスゴ録 v2（2026-09-10 ポム）— 桃鉄型の路線網。OSM の道路・鉄道に沿った 963 マス（data/board_v2.json→board_v2.js）
   ・サイコロ 60分に1回・3回まで貯まる／分かれ道で行き先を選ぶ／目的地（探検録のスポット）に着くとご褒美→次の目的地

  Object.keys(byStation).forEach(st => { const list = byStation[st]; const base = list[0]; const stn = B.stations.find(x => x.id === st); const town = (stn ? stn.area : "") || "";
    let k = 0; while (list.length < 3 + (base.price >= 800 ? 2 : 0)) { const kinds = GEN[base.kind] || ["商店"]; const nm = `${town}の${kinds[k % kinds.length]}${k >= kinds.length ? k + 1 : ""}`; const price = Math.round((100 + srand() * 600) / 10) * 10; const y = [0.05, 0.08, 0.1, 0.12, 0.15][Math.floor(srand() * 5)]; const q = { id: "g" + (seq++), station: st, name: nm, kind: base.kind, price, yield: y, note: "" }; B.properties.push(q); list.push(q); k++; } });

const KEY = "nagaoka_sugoroku_v3";   // 盤面 v3（道路網を広げた）で保存を切り替え

const save = () => { localStorage.setItem(KEY, JSON.stringify(S)); cloudPush(); };
/* 正本を自分の状態に反映。移動中・カード表示中は pendingGame に退避して後で */
let pendingGame = null;
function applyGame(g) { if (!g) return; GAME = g; if (busy || $("card").style.display === "block") { pendingGame = g; return; } pendingGame = null;
  if (g.destId !== undefined && byId[g.destId] && g.destId !== S.dest) { S.dest = g.destId; S.destBonus = g.destBonus || destBonus(hops(S.pos, S.dest)); $("msg").textContent = `🎡 誰かが到着。つぎの目的地は ${stName(byId[S.dest])}（${byId[S.dest].area || ""}）！ 援助金 ${S.destBonus}万両`; save(); hud(); draw(); }
  if ((g.settlementDoneYear || 0) > (S.settledYear || 0)) { const y = S.owned.reduce((a, id) => a + income(pv(id), "you"), 0); S.money += y; S.settledYear = g.settlementDoneYear; $("msg").textContent = `📒 ${g.settlementDoneYear}年目の3月決算（みんな共通）: 物件 +${y}万両`; save(); hud(); } }
async function cloudSetDest(prevDest) { if (!FB || !UID) return; try { await FB.runTransaction(async tx => { const ref = FB.collection("sugoroku_games").doc("main"); const d = await tx.get(ref); const g = d.exists ? d.data() : {};
      if (g.destId !== undefined && g.destId !== prevDest && byId[g.destId]) { throw { adopt: g }; }   // 先に誰かが変えていた → それに従う
      tx.set(ref, { destId: S.dest, destBonus: S.destBonus, by: UID, updatedAt: Date.now() }, { merge: true }); }); }
  catch (e) { if (e && e.adopt) { S.dest = e.adopt.destId; S.destBonus = e.adopt.destBonus || destBonus(hops(S.pos, S.dest)); save(); hud(); draw(); } else console.warn("cloudSetDest fallback local", e && e.code); } }
async function cloudSettle(year) { if (!FB || !UID) return; try { await FB.runTransaction(async tx => { const ref = FB.collection("sugoroku_games").doc("main"); const d = await tx.get(ref); const g = d.exists ? d.data() : {}; if ((g.settlementDoneYear || 0) >= year) return; tx.set(ref, { settlementDoneYear: year, updatedAt: Date.now() }, { merge: true }); }); } catch (e) { console.warn("cloudSettle", e && e.code); } }
function cloudRelease(propId) { if (!FB || !UID) return; FB.collection("sugoroku_props").doc(propId).delete().catch(() => {}); }
function refill() { const g = Math.floor((Date.now() - S.lastDice) / (R.diceCooldownMin * 60000)); if (g > 0) { S.dice = Math.min(R.diceStockMax, S.dice + g); S.lastDice += g * R.diceCooldownMin * 60000; if (S.dice >= R.diceStockMax) S.lastDice = Date.now(); save(); } }
/* 座標 → 画面: 緯度経度をメルカトルで平面に。カメラはコマを追う */
const cv = document.getElementById("cv"), ctx = cv.getContext("2d"); const DPR = devicePixelRatio || 1; let W, H;
const merc = n => ({ x: n.lng, y: -Math.log(Math.tan(Math.PI / 4 + n.lat * Math.PI / 360)) * 180 / Math.PI });

let cam = { ...P[S.pos] }, zoom = 15000;   // 1度 ≒ 15000px（1マス≒200m が約 26px・絵の解像度に合わせて引き気味）
function layout() { W = cv.width = innerWidth * DPR; H = cv.height = innerHeight * DPR; }
const scr = p => ({ x: W / 2 + (p.x - cam.x) * zoom * DPR, y: H * 0.42 + (p.y - cam.y) * zoom * DPR });
const COL = { blue: "#4a7fd6", red: "#d9553a", yellow: "#e6c34a", event: "#9a6fd0", dest: "#3aa66a", prop: "#f08a1e", fork: "#fff" };
/* ---------- 地図をデータから描く（桃鉄の地図の質感: 平らな色面と線） ---------- */

const FILL = { farmland: "#f2ec9c", forest: "#5f9a4c", wood: "#5f9a4c", scrub: "#9fc06b", grassland: "#bcd47a", residential: "#efe3cf", industrial: "#ddd6cb", commercial: "#eadcc6", retail: "#eadcc6", water: "#6fb6e6" };

  for (const o of TP.water) { if (o.k !== "coastline") continue; if (!inView(o.pts, 4000)) continue; const pts = o.pts; const far = pts.map(p => p[0]).reduce((a, b) => Math.min(a, b)) - 0.5; const closed = [[far, pts[0][1]]].concat(pts, [[far, pts[pts.length - 1][1]]]); poly(closed, "#5aa9e0"); poly(pts, null, "#2f7fbf", 3); }

/* ---- 紫マスの長岡イベント ---- */

  { name: "雲海", text: "山古志の雲海に感動。+150万両", f: () => { S.money += 150; return 150; } },

const pv = id => B.properties.find(q => q.id === id);

const DEBT_MIN = -1000; const pay = v => { const before = S.money; S.money = Math.max(DEBT_MIN, S.money - v); return before - S.money; };   // 実際に払えた額
/* 季節増収（デク提案6）: 物件の種類 × 月。花火館は8月×3、酒蔵は冬×2、海の市場は夏×1.5、温泉は冬×2、闘牛は5月・9月×2、アルパカは春×1.5 */
function monthNow() { const m = 4 + Math.floor((S.turn % TURNS_PER_YEAR) / (TURNS_PER_YEAR / 12)); return m > 12 ? m - 12 : m; }
function seasonMul(pr) { const m = monthNow(); const id = pr.id;
  if (pr.name === "はなび館") return m === 8 ? 3 : 1;
  if (pr.kind === "酒蔵" || pr.kind === "醸造") return [12, 1, 2].includes(m) ? 2 : 1;
  if (pr.kind === "市場") return [7, 8].includes(m) ? 1.5 : 1;
  if (pr.kind === "宿") return [12, 1, 2].includes(m) ? 2 : 1;
  if (pr.name === "うし相撲場") return [5, 9].includes(m) ? 2 : 1;
  if (pr.name === "アルパカぼくじょう") return [4, 5].includes(m) ? 1.5 : 1;
  return 1; }
/* エリア独占: 同じ駅エリアの物件を全部持つと収益2倍 */
const areaOf = pr => (B.stations.find(st => st.id === pr.station) || {}).area || pr.station;
function monopoly(pr, who) { const same = B.properties.filter(q => q.station === pr.station); return same.length > 1 && same.every(q => ownerOf(q.id) === who); }
function income(pr, who) { let v = Math.round(pr.price * pr.yield * seasonMul(pr)); if (monopoly(pr, who)) v *= 2; if (who === "you" && S.komeInvest) v = Math.round(v * (1 + 0.05 * S.komeInvest)); return v; }
function showShop(st, list) { const stn = B.stations.find(x => x.id === st); $("cTitle").textContent = `${(stn && stn.name || "").replace(/（.*?）|／.*$/g, "")} の物件`; $("cBody").innerHTML = ""; const box = $("cBody");
  list.forEach(q => { const row = document.createElement("div"); row.style.cssText = "display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #eee"; row.innerHTML = `<span>${q.name}<br><small>${q.kind}・実り ${Math.round(q.yield * 100)}%</small></span>`; const b = document.createElement("button"); b.style.cssText = "flex:0 0 auto;padding:8px 12px;font-size:14px"; const prc = Math.round(q.price * (S.sale || 1)); b.textContent = prc + "万両" + (S.sale ? "（2割引）" : ""); b.disabled = S.money < prc;
    b.onclick = async () => { b.disabled = true; if (S.owned.includes(q.id) || S.money < prc) { row.remove(); return; } const ok = await cloudBuy(q.id); if (!ok) { row.remove(); return; } S.money -= prc; S.sale = 0; S.owned.push(q.id); row.remove(); $("msg").textContent = `${q.name} を買った！` + (monopoly(q, "you") ? "　この駅を独占！収益2倍" : ""); save(); draw(); hud(); if (!box.children.length) $("card").style.display = "none"; }; row.appendChild(b); box.appendChild(row); });
  $("cBuy").style.display = "none"; $("cSkip").textContent = "閉じる"; $("cSkip").onclick = closeCard; $("card").style.display = "block"; }
function closeCard() { $("card").style.display = "none"; $("cBuy").style.display = ""; $("cBuy").textContent = "買う"; $("cSkip").textContent = "やめる"; $("cBody").innerHTML = ""; hud();  if (pendingGame) setTimeout(() => applyGame(pendingGame), 0); }
function total() { return S.money + S.owned.reduce((a, id) => a + pv(id).price, 0); }
function arrive() { const n = byId[S.pos]; const prop = n.prop ? pv(n.prop) : null;
  if (S.pos === S.dest) { const bonus = S.destBonus || destBonus(0); S.money += bonus; S.reached++; $("msg").textContent = `🎯 目的地 ${stName(n)} に到着！ 援助金 +${bonus}万両`; attachYukinko(); if (!rouletteQueued) { rouletteQueued = true; rouletteFrom = S.dest; S.dest = null; setTimeout(roulette, 900); } }
  const owner = prop ? ownerOf(prop.id) : null;
  if (prop && owner && owner !== "you") { const toll = pay(income(prop, owner)); const rv = S.rivals.find(r => r.id === owner); if (rv) rv.money += toll; $("msg").textContent = `${ownerName(owner)} の ${prop.name}。通行料 −${toll}万両`; return; }
  if (prop) { const list = stationProps(prop.station).filter(q => !ownerOf(q.id)); if (list.length) { showShop(prop.station, list); return; } }
  if (prop && !owner) { $("cTitle").textContent = `${prop.name}（${prop.kind}）`; $("cBody").textContent = `価格 ${prop.price}万両・年の実り ${Math.round(prop.yield * 100)}%${prop.note ? "・" + prop.note : ""}`; $("cBuy").disabled = S.money < prop.price; $("card").style.display = "block";
    $("cBuy").onclick = async () => { $("cBuy").disabled = true; const ok = await cloudBuy(prop.id); if (!ok) { $("card").style.display = "none"; $("msg").textContent = `${prop.name} は一足先に別の旅人が買ってしまった！`; hud(); return; } S.money -= prop.price; S.owned.push(prop.id); $("card").style.display = "none"; $("msg").textContent = `${prop.name} はあなたのもの！`; save(); draw(); hud(); };
    $("cSkip").onclick = () => { $("card").style.display = "none"; hud(); }; return; }
  if (prop) { const inc = income(prop, "you"); const mul = seasonMul(prop); S.money += inc; $("msg").textContent = `自分の ${prop.name} に到着。売上 +${inc}万両` + (mul > 1 ? `（${monthNow()}月の書き入れ時 ×${mul}）` : "") + (monopoly(prop, "you") ? "（独占 ×2）" : ""); return; }
  if (S.pos === S.dest) return;
  if (n.station === "kome100" && S.money >= 200 && (S.komeInvest || 0) < 5) { $("cTitle").textContent = "米百俵（学びへの投資）"; $("cBody").textContent = `いま200万両を出すと、以後すべての物件の収益 +5%（いま ${S.komeInvest || 0}口・最大5口）。食えないからこそ、学びに。`; $("cBuy").textContent = "200万両を出す"; $("cBuy").disabled = false; $("card").style.display = "block";
    $("cBuy").onclick = () => { S.money -= 200; S.komeInvest = (S.komeInvest || 0) + 1; $("card").style.display = "none"; $("cBuy").textContent = "買う"; $("msg").textContent = `米百俵の学び ${S.komeInvest}口。物件の収益 +${5 * S.komeInvest}%`; save(); hud(); };
    $("cSkip").onclick = () => { $("card").style.display = "none"; $("cBuy").textContent = "買う"; hud(); }; return; }
  if (n.t === "blue") { let v = 20 + Math.floor(Math.random() * 8) * 10; if (S.kome > 0) { v = Math.round(v * 1.5); S.kome--; } if (S.ryokan) { v += S.ryokan; S.ryokan = 0; } S.money += v; $("msg").textContent = `青マス。+${v}万両`; }
  else if (n.t === "red" && S.phoenix) { S.phoenix = 0; $("msg").textContent = "赤マス。フェニックスカードが支払いを0にした！"; }
  else if (n.t === "red") { let v = 10 + Math.floor(Math.random() * 6) * 10; if (S.redShield) { v = Math.round(v / 2); S.redShield = 0; } v = pay(v); $("msg").textContent = `赤マス。−${v}万両` + (S.money < 0 ? "（借金中）" : ""); }

}
/* 3月の決算（年の最後の手番）: 物件収益 − 借金の利子。年末の順位発表 */
function settlement() { if (S.turn % TURNS_PER_YEAR !== 0) return; const yr = yearNow() - 1; const already = (S.settledYear || 0) >= yr; const y = already ? 0 : S.owned.reduce((a, id) => a + income(pv(id), "you"), 0); let msg = `📒 ${yr}年目の3月決算: 物件 +${y}万両` + (already ? "（みんなの決算で受け取り済み）" : ""); S.money += y; S.settledYear = Math.max(S.settledYear || 0, yr); cloudSettle(yr);
  if (S.money < 0) { const i = pay(Math.round(-S.money * 0.1)); msg += `　借金の利子 −${i}万両`; }
  S.rivals.forEach(r => { r.money += r.owned.reduce((a, id) => a + income(pv(id), r.id), 0); });
  const rows = [{ name: "あなた", total: total() }].concat(S.rivals.map((r, i) => ({ name: RIVALS[i].name, total: r.money + r.owned.reduce((a, id) => a + pv(id).price, 0) }))).sort((a, b) => b.total - a.total);
  msg += `　🏆 年末の順位: ` + rows.map((r, i) => `${i + 1}位 ${r.name}`).join("・"); if (yearNow() > R.years) msg += `　🎉 3年の旅が終了。総資産 ${total()}万両`;
  $("msg").textContent = msg; }
$("roll").onclick = roll;
/* ---- 初回の導線 ---- */
const INTRO = [
  ["ながおかスゴ録へようこそ", "アルパカの旅人になって、本物の長岡の道を旅します。道も川も駅も、全部実際の場所です。"],
  ["サイコロは1時間に1回", "サイコロは1時間に1つ貯まり、3つまで持てます。毎日ちょっと開いて、少しずつ進むゲームです。分かれ道では行き先を自分で選べます。"],
  ["目的地と物件", "上に出ている目的地（探検録のスポット）に着くとご褒美。橙のマスでは店や蔵などの物件が買えて、他の旅人が止まると通行料が入ります。3年後の総資産で勝負。"],
  ["名前を決めて出発", "順位や物件に出る名前です。"],

function showIntro() { let i = 0; const box = $("intro"); box.style.display = "flex";
  const step = () => { const [t, b] = INTRO[i]; $("iTitle").textContent = t; $("iBody").textContent = b; const last = i === INTRO.length - 1; $("iName").style.display = last ? "block" : "none"; $("iNext").textContent = last ? "出発！" : "つぎへ"; };
  $("iNext").onclick = () => { if (i < INTRO.length - 1) { i++; step(); return; } const v = $("iName").value.trim(); S.name = v.slice(0, 12) || "旅人"; S.introDone = true; save(); box.style.display = "none"; hud(); $("msg").textContent = `${S.name}、いってらっしゃい。まずはサイコロを。`; };
  step(); }
if (!S.introDone) setTimeout(showIntro, 400); else if (!S.dest) roulette();
/* ---- 目的地の方角矢印（画面の外にあるとき） ---- */
function drawArrow() { const el = $("arrow"); if (!S.dest) { el.style.display = "none"; return; } const p = scr(P[S.dest]); const x = p.x / DPR, y = p.y / DPR, w = innerWidth, h = innerHeight - 180;
  if (x > 20 && x < w - 20 && y > 90 && y < h) { el.style.display = "none"; return; }
  const cx = w / 2, cy = h / 2; const dx = x - cx, dy = y - cy; const ang = Math.atan2(dy, dx); const rx = cx - 34, ry = cy - 34; const t = Math.min(Math.abs(rx / Math.cos(ang)), Math.abs(ry / Math.sin(ang)));
  el.style.display = "flex"; el.style.left = (cx + Math.cos(ang) * t - 22) + "px"; el.style.top = (cy + Math.sin(ang) * t - 22 + 20) + "px"; el.style.transform = ""; }
const _draw = draw; draw = function (tp) { _draw(tp); drawArrow(); };
/* ---- BGM（あれば） ---- */
const hourNow = new Date().getHours(); const BGM = new Audio(hourNow >= 18 || hourNow < 6 ? "music/night.mp3" : "music/travel.mp3"); BGM.loop = true; BGM.volume = 0.45; let sndOn = false;   // 夜は夕暮れの曲

const _runEvent = runEvent; runEvent = function () { _runEvent(); if (sndOn) { JINGLE.currentTime = 0; JINGLE.play().catch(() => {}); } };

function renderHand() { const box = $("hand"); box.innerHTML = ""; S.cards = (S.cards || []).filter(id => CARDS.some(x => x.id === id)); if (!S.cards.length) { box.style.display = "none"; return; } box.style.display = "flex"; box.style.flexWrap = "wrap"; S.cards.forEach((id, i) => { const c = CARDS.find(x => x.id === id); const b = document.createElement("button"); b.style.flex = "1 1 30%"; b.className = "ghost"; b.style.fontSize = "13px"; b.textContent = c.name; b.title = c.desc; b.onclick = () => { if (busy) return; useCard(i); renderHand(); }; box.appendChild(b); }); }
$("rank").onclick = () => { const rows = [{ name: "あなた", total: total() }].concat(Object.values(OTHERS).map(o => ({ name: o.name || "旅人", total: (o.money || 0) + (o.owned || []).reduce((a, id) => a + (pv(id) ? pv(id).price : 0), 0) }))).concat(S.rivals.map((r, i) => ({ name: RIVALS[i].name, total: r.money + r.owned.reduce((a, id) => a + pv(id).price, 0) }))).sort((a, b) => b.total - a.total); $("msg").textContent = "総資産: " + rows.map((r, i) => `${i + 1}位 ${r.name} ${r.total}`).join("　"); };
const _hud = hud; hud = function () { _hud(); renderHand(); };
$("assets").onclick = () => { const l = S.owned.map(id => pv(id).name); $("msg").textContent = l.length ? "持ち物件: " + l.join("、") + `　／ 総資産 ${total()}万両` : "まだ物件はありません。"; };
refill(); const today = new Date().toDateString(); if (S.dice >= R.diceStockMax && S.lastGift !== today) { S.lastGift = today; S.money += 50; save(); setTimeout(() => { $("msg").textContent = "☀ 朝市ボーナス +50万両（サイコロが満タンの日に開くともらえる）"; }, 300); }
function showReturnDigest() { const away = Date.now() - (S.lastSeen || 0); if (S.lastSeen && away > 30 * 60000 && S.dest && byId[S.dest]) { const dd = distFrom(S.dest); const lead = S.rivals.map((r, i) => ({ name: RIVALS[i].name, h: dd[r.pos] === undefined ? 999 : dd[r.pos] })).sort((a, b) => a.h - b.h)[0]; const recent = (S.log || []).slice(-2).join("／"); const hrs = Math.floor(away / 3600000);
    $("msg").textContent = `🏠 ${hrs >= 1 ? hrs + "時間ぶり" : "おかえり"}。目的地は ${stName(byId[S.dest])}（あなた あと${hops(S.pos, S.dest)}マス／${lead.name} あと${lead.h}マス）` + (recent ? "　" + recent : "") + `　サイコロ ${S.dice}個`; }
