<script>
/* ながおかスゴ録 v2（2026-09-10 ポム）— 桃鉄型の路線網。OSM の道路・鉄道に沿った 963 マス（data/board_v2.json→board_v2.js）
   ・サイコロ 60分に1回・3回まで貯まる／分かれ道で行き先を選ぶ／目的地（探検録のスポット）に着くとご褒美→次の目的地
   ・青=もらう 赤=払う 黄=カード（仮） 紫=イベント（仮） 緑=目的地 橙=物件（買える・自分のに止まると売上）
   ・絵はまだ無い（masa の image2.5 の地図とマス絵を後で敷く）。データは端末保存（Firestore 共有は次） */
const ENTRY_MODE = typeof location !== "undefined" && !['solo','d04'].includes(new URLSearchParams(location.search).get('mode')) && !new URLSearchParams(location.search).has('match') && new URLSearchParams(location.search).get('emu') !== '1' && !new URLSearchParams(location.search).has('kt');
const D04_MODE = typeof location !== "undefined" && (new URLSearchParams(location.search).get("mode") === "d04" || new URLSearchParams(location.search).has("match") || new URLSearchParams(location.search).get("emu") === "1");
const GRID_SOLO = typeof location !== 'undefined' && !D04_MODE && !ENTRY_MODE;
let soloReady = !GRID_SOLO;
const B = BOARD_DATA; const R = B.rules; R.freeDice = true;   /* テスト期間: サイコロ制限なし（masa 2026-09-11） */ const NODES = B.nodes; const byId = Object.fromEntries(NODES.map(n => [n.id, n]));
const ADJ = {}; const EPTS = {};   // EPTS["a-b"] = 道路のポリライン（a→b の向き）
B.edges.forEach(e => { const [a, b] = Array.isArray(e) ? e : [e.a, e.b]; (ADJ[a] = ADJ[a] || []).push(b); (ADJ[b] = ADJ[b] || []).push(a); if (e.pts) { EPTS[a + "-" + b] = e.pts; EPTS[b + "-" + a] = e.pts.slice().reverse(); } });
const edgePts = (a, b) => EPTS[a + "-" + b] || [[byId[a].lat, byId[a].lng], [byId[b].lat, byId[b].lng]];
let START = NODES.find(n => n.station === "nagaoka_st").id;
/* 物件駅: 元の18物件を駅（station）ごとに束ね、3件未満の駅には伏せ名の物件を足す（価格・収益率は桃鉄風のレンジ） */
const GEN = { "飲食": ["らーめん処", "そば処", "甘味処", "喫茶"], "観光": ["みやげ処", "資料館", "遊覧船", "展望台"], "工芸": ["工房", "問屋", "ギャラリー"], "酒蔵": ["直売所", "酒房"], "市場": ["浜焼き屋", "干物屋"], "宿": ["民宿", "湯宿"], "生産": ["直売所", "加工場"], "食": ["茶屋", "総菜屋"], "醸造": ["直売所"] };
let _seed = 20260910; const srand = () => { _seed = (_seed * 1103515245 + 12345) & 0x7fffffff; return _seed / 0x7fffffff; };   // 全端末で同じ物件リスト（デク指摘）
(function expand() { const byStation = {}; B.properties.forEach(p => (byStation[p.station] = byStation[p.station] || []).push(p)); let seq = 100;
  Object.keys(byStation).forEach(st => { const list = byStation[st]; const base = list[0]; const stn = B.stations.find(x => x.id === st); const town = (stn ? stn.area : "") || "";
    let k = 0; while (list.length < 3 + (base.price >= 800 ? 2 : 0)) { const kinds = GEN[base.kind] || ["商店"]; const nm = `${town}の${kinds[k % kinds.length]}${k >= kinds.length ? k + 1 : ""}`; const price = Math.round((100 + srand() * 600) / 10) * 10; const y = [0.05, 0.08, 0.1, 0.12, 0.15][Math.floor(srand() * 5)]; const q = { id: "g" + (seq++), station: st, name: nm, kind: base.kind, price, yield: y, note: "" }; B.properties.push(q); list.push(q); k++; } });
})();
const stationProps = st => B.properties.filter(q => q.station === st);
const KEY = GRID_SOLO ? 'nagaoka_sugoroku_solo_1e48703b19599772' : 'nagaoka_sugoroku_v3';
const TURNS_PER_YEAR = 36;   // 1か月＝3手番・1年＝36手番（仕様 §3・デク指摘）
const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch { return null; } };
const RIVALS = [{ id: "kon", name: "コン", icon: "🦊" }, { id: "kabuto", name: "愛の兜", icon: "⛑️" }, { id: "ryokan", name: "良寛さん", icon: "🧘" }];   // CPUの旅人（探検録の顔ぶれ）
const newRivals = () => RIVALS.map(r => ({ id: r.id, pos: START, prev: null, money: R.startMoney, owned: [], dest: null, reached: 0 }));
let S = ((!D04_MODE && !ENTRY_MODE && !GRID_SOLO) && load()) || { pos: START, prev: null, money: R.startMoney, owned: [], dice: R.diceStockMax, lastDice: Date.now(), turn: 0, dest: null, reached: 0, log: [], cards: [], skip: 0, rivals: newRivals() };
if (!S.rivals) { S.rivals = newRivals(); S.cards = S.cards || []; S.skip = 0; }
/* ---- 共有盤面（Firestore）---- */
let FB = null, UID = null, OTHERS = {}, PROPS = {}, GAME = null;   // GAME: 正本 sugoroku_games/main   // OTHERS: 他の実プレイヤー / PROPS: 物件の持ち主 {propId: {owner, name}}
const FIREBASE_OPTIONS = { apiKey: "AIzaSyDtDZIEQtBzjujnpTDcXt1QeEU2r-wbg74", authDomain: "kakigawatei-franchise.firebaseapp.com", projectId: "kakigawatei-franchise" };
if ((!D04_MODE && !ENTRY_MODE && !GRID_SOLO)) { try { firebase.initializeApp(FIREBASE_OPTIONS); FB = firebase.firestore(); } catch (e) { console.warn("firebase off", e); } }
const ownerOf = pid => S.owned.includes(pid) ? "you" : (PROPS[pid] && PROPS[pid].owner && PROPS[pid].owner !== UID) ? "p:" + PROPS[pid].owner : (S.rivals.find(r => r.owned.includes(pid)) || {}).id || null;
const ownerName = o => o === "you" ? "あなた" : o && o.startsWith("p:") ? ((OTHERS[o.slice(2)] || {}).name || "旅人") : ((RIVALS.find(r => r.id === o) || {}).name || "");
async function cloudStart(preferLocal = false) { if (!FB) return; try {
    const cred = await firebase.auth().signInAnonymously(); UID = cred.user.uid;
    const ref = FB.collection("sugoroku_players").doc(UID); const snap = await ref.get();
    if (snap.exists && !preferLocal && !S.turnFlow && !S.finalResults) { const c = snap.data(); ["pos", "prev", "money", "owned", "dice", "lastDice", "turn", "dest", "reached", "cards", "skip", "komeInvest", "name", "destBonus", "settledYear", "lastSeen", "destCount"].forEach(k => { if (c[k] !== undefined) S[k] = c[k]; }); compat(); if (isFinished()) { freezeResults(); showResults(); } save(); }
    else await cloudPush();
    try { const g = (await FB.collection("sugoroku_games").doc("main").get()).data(); if (g && byId[g.destId]) applyGame(g); else { if (!S.dest || !byId[S.dest]) pickDest(); await cloudSetDest(S.dest); } } catch (e) { console.warn("game doc", e && e.code); }   // 正本が無ければ最初の人が目的地を書く
    FB.collection("sugoroku_players").where("updatedAt", ">", Date.now() - 7 * 86400000).onSnapshot(q => { OTHERS = {}; q.forEach(d => { if (d.id !== UID) OTHERS[d.id] = d.data(); }); draw(); });
    FB.collection("sugoroku_props").onSnapshot(q => { PROPS = {}; q.forEach(d => { PROPS[d.id] = d.data(); }); draw(); hud(); });
    /* 正本（目的地・決算）に追従 */
    FB.collection("sugoroku_games").doc("main").onSnapshot(d => { if (!d.exists) return; applyGame(d.data()); });
    hud(); draw();
  } catch (e) { console.warn("cloud start failed", e); } }
let pushTimer = null;
function cloudPush() { if (!FB || !UID) return; clearTimeout(pushTimer); pushTimer = setTimeout(() => { const out = { updatedAt: Date.now(), name: S.name || "旅人" }; ["pos", "prev", "money", "owned", "dice", "lastDice", "turn", "dest", "reached", "cards", "skip", "komeInvest", "destBonus", "settledYear", "lastSeen", "destCount"].forEach(k => { if (S[k] !== undefined && !(k === "dest" && S[k] === null)) out[k] = S[k]; }); FB.collection("sugoroku_players").doc(UID).set(out, { merge: true }).catch(e => console.warn("push", e)); }, 500); }
/* 物件を買う: 早い者勝ちをトランザクションで */
async function cloudBuy(propId) { if (!FB || !UID) return true; try { await FB.runTransaction(async tx => { const ref = FB.collection("sugoroku_props").doc(propId); const d = await tx.get(ref); if (d.exists && d.data().owner && d.data().owner !== UID) throw new Error("taken"); tx.set(ref, { owner: UID, name: S.name || "旅人", at: Date.now() }); }); return true; } catch (e) { if (e && e.message === "taken") return false; if (e && e.code === "permission-denied") { console.warn("cloudBuy: ルール未設定→端末側で成立"); return true; } $("msg").textContent = "いまはつながらないので買えません（オンラインで再度）"; return false; } }   // ルール未設定・オフラインは端末側で成立させる
function compat() { if (S.kome === true) S.kome = 3; if (S.destCount === undefined && S.reached > 0) S.destCount = S.reached; } compat();   /* 旧データ互換（クラウド読み込み後にも） */
const save = () => { if (D04_MODE || ENTRY_MODE || !soloReady) return; localStorage.setItem(KEY, JSON.stringify(S)); cloudPush(); };
/* 正本を自分の状態に反映。移動中・カード表示中は pendingGame に退避して後で */
let pendingGame = null;
function applyGame(g) { if (!g || S.finalResults) return; GAME = g; if (busy || S.turnFlow || rouletteQueued || $("card").style.display === "block") { pendingGame = g; return; } pendingGame = null;
  if (g.destId !== undefined && byId[g.destId] && g.destId !== S.dest) { S.dest = g.destId; S.destBonus = g.destBonus || destBonus(hops(S.pos, S.dest)); $("msg").textContent = `🎡 誰かが到着。つぎの目的地は ${stName(byId[S.dest])}${String(byId[S.dest].area || "").trim() ? "（" + String(byId[S.dest].area).trim() + "）" : ""}！ 援助金 ${S.destBonus}万両`; save(); hud(); draw(); }
  if ((g.settlementDoneYear || 0) > (S.settledYear || 0)) { const y = S.owned.reduce((a, id) => a + income(pv(id), "you"), 0); S.money += y; S.settledYear = g.settlementDoneYear; $("msg").textContent = `📒 ${g.settlementDoneYear}年目の3月決算（みんな共通）: 物件 +${y}万両`; save(); hud(); } }
async function cloudSetDest(prevDest) { if (!FB || !UID) return; try { await FB.runTransaction(async tx => { const ref = FB.collection("sugoroku_games").doc("main"); const d = await tx.get(ref); const g = d.exists ? d.data() : {};
      if (g.destId !== undefined && g.destId !== prevDest && byId[g.destId]) { throw { adopt: g }; }   // 先に誰かが変えていた → それに従う
      tx.set(ref, { destId: S.dest, destBonus: S.destBonus, by: UID, updatedAt: Date.now() }, { merge: true }); }); }
  catch (e) { if (e && e.adopt) { S.dest = e.adopt.destId; S.destBonus = e.adopt.destBonus || destBonus(hops(S.pos, S.dest)); save(); hud(); draw(); } else console.warn("cloudSetDest fallback local", e && e.code); } }
async function cloudSettle(year) { if (!FB || !UID) return; try { await FB.runTransaction(async tx => { const ref = FB.collection("sugoroku_games").doc("main"); const d = await tx.get(ref); const g = d.exists ? d.data() : {}; if ((g.settlementDoneYear || 0) >= year) return; tx.set(ref, { settlementDoneYear: year, updatedAt: Date.now() }, { merge: true }); }); } catch (e) { console.warn("cloudSettle", e && e.code); } }
function cloudRelease(propId) { if (!FB || !UID) return; FB.collection("sugoroku_props").doc(propId).delete().catch(() => {}); }

    loading(){busy=true;soloReady=false;$('msg').textContent='地図を読み込んでいます';$('cTitle').textContent='地図を読み込んでいます';$('cBody').replaceChildren();$('cBuy').style.display='none';$('cSkip').disabled=true;$('card').style.display='block';},
    failed(retry){$('cTitle').textContent='地図または保存データを読み込めませんでした';$('cSkip').disabled=false;$('cSkip').textContent='再確認';$('cSkip').onclick=retry;},
    boot(display,catalog,renderer,saved){
      installBoardData(display,catalog,renderer);
      S=saved||{boardVersion:catalog.boardVersion,pos:START,prev:null,money:R.startMoney,owned:[],dice:R.diceStockMax,lastDice:Date.now(),turn:0,dest:null,reached:0,log:[],cards:[],skip:0,rivals:newRivals()};
      FB=null;UID=null;PROPS={};OTHERS={};GAME=null;cam={...P[S.pos]};compat();soloReady=true;busy=false;
      $('msg').textContent=S.finalResults?'3年の旅は終了しました':S.turnFlow?'前の手番を再開しています':S.nextDestination?'次の目的地を決めています':'あなたの番';
      $('card').style.display='none';$('cSkip').disabled=false;$('cSkip').textContent='やめる';$('cSkip').onclick=closeCard;$('cBuy').style.display='';cv.style.visibility='visible';
      ['assets','rank','nameBtn'].forEach(id=>$(id).disabled=false);
      if(!S.dest&&!S.turnFlow&&!isFinished())pickDest();refill();
      if(!isFinished()&&S.dice>=R.diceStockMax&&S.lastGift!==today){S.lastGift=today;S.money+=50;$('msg').textContent='朝市ボーナス +50万両';}
      save();hud();draw();
      if(!saved&&localStorage.getItem('nagaoka_sugoroku_v3')){
        $('cTitle').textContent='盤面が新しくなったので最初から';$('cBody').replaceChildren();$('cBuy').style.display='none';$('cSkip').textContent='はじめる';$('cSkip').onclick=()=>{closeCard();showIntro();};$('card').style.display='block';hud();
      }else if(!S.introDone&&!S.turnFlow&&!isFinished())showIntro();
      if(S.turnFlow){const shop=S.turnFlow.shop;if(S.turnFlow.stage==='arrival'&&shop){if(shop.type==='cards')cardShop();else showShop(shop.station,stationProps(shop.station).filter(p=>!ownerOf(p.id)));}continueTurn().catch(e=>{console.warn('solo resume',e);});}
      else if(isFinished()){freezeResults();showResults();}
      else if(S.nextDestination){busy=true;roulette().finally(()=>{busy=false;hud();});}
      setInterval(()=>{refill();hud();},30000);
    }
  };
  SUGOROKU_SOLO_VIEW.loading();
}
if (ENTRY_MODE) {layout(); draw(); $('wrap').classList.add('mode-menu-open'); $('modeMenu').style.display='grid';}
if (D04_MODE) {
  S.rivals = []; S.cards = []; busy = true;
  layout(); draw(); $("msg").textContent = "対局に接続中";
  ["roll", "assets", "rank", "nameBtn"].forEach(id => { $(id).onclick = null; $(id).disabled = true; });
  globalThis.SUGOROKU_D04_VIEW = {
    config: FIREBASE_OPTIONS,
    catalog: {nodes: B.nodes, edges: B.edges, stations: B.stations, properties: B.properties, rules: B.rules},
    installBoard(display,catalog,renderer){
      Object.assign(this,installBoardData(display,catalog,renderer));
    },
    cards: CARDS.map(({id, name, desc, price}) => ({id, name, desc, price: price || 100})),
    planRoute(game,uid,commit){const seat=Object.values(game.seats).find(s=>s.uid===uid);clearForkUI();return TRAVEL_ROUTE.open({...routeConfig(seat.pos,game.turnContext.remainingSteps,game.turnContext.previousNode,seat.effects?.guide||0),commit:path=>{$('mapInspect').hidden=true;commit(path);}});},
    nodeName: id => byId[id] ? stName(byId[id]) : "",
    distance: (from, to) => byId[from] && byId[to] ? hops(from, to) : null,
    paint(game, uid) {
      mapGame=game;
      const entries = Object.entries(game.seats || {});
      const mine = entries.find(([, seat]) => seat.uid === uid);
      if (!mine) return;
      const owned = id => Object.keys(game.propertyOwners || {}).filter(p => game.propertyOwners[p] === id);
      const others = entries.filter(([id]) => id !== mine[0]);
      const previousPos = S.pos;
      S = {...S, ...mine[1], visualSeat:Number(mine[0].slice(1)), owned: owned(mine[0]), dest: game.destination?.nodeId ?? null, destBonus: game.destination?.bonus ?? 0,
        cards: [], rivals: others.filter(([, seat]) => P[seat.pos]).map(([id, seat]) => ({...seat, id, owned: owned(id)}))};
      if (!P[S.pos]) S.pos = START;
      RIVALS.splice(0, RIVALS.length, ...S.rivals.map(seat => ({id: seat.id, name: seat.name, icon: seat.kind === "cpu" ? "⛑️" : "🐑"})));
      PROPS = {}; OTHERS = {};
      if (S.pos !== previousPos) cam = {...P[S.pos]};
      draw();
    },
    directions(ids, pick, disabled, remaining) {
      clearForkUI(); const generation=forkGeneration;
      const valid = ids.filter(id => P[id]);
      const finish = id => { if(disabled || generation!==forkGeneration || !valid.includes(id))return; clearForkUI(); pick(id); };
      globalThis.TRAVEL_UI?.pad(valid.map(id=>({id,x:scr(P[id]).x-scr(P[S.pos]).x,y:scr(P[id]).y-scr(P[S.pos]).y,distance:hops(id,S.dest),label:dirName(S.pos,id)})),remaining,finish,disabled);
      const elements = valid.map(id => {
        const el = document.createElement("button"); el.className = "fork" + (S.dest && hops(id, S.dest) < hops(S.pos, S.dest) ? " dest" : "");
        const symbol = document.createElement("span"); symbol.textContent = "➤"; el.appendChild(symbol);
        el.title = `${dirName(S.pos, id)}・あと${hops(id, S.dest)}マス`; el.setAttribute("aria-label", el.title);
        el.disabled = disabled; el.onclick = () => finish(id); $("wrap").appendChild(el); return el;
      });
      forkPlace = () => valid.forEach((id, i) => { const p = scr(P[id]); const from = scr(P[S.pos]); const angle = Math.atan2(p.y - from.y, p.x - from.x);
        elements[i].style.left = `${p.x / DPR}px`; elements[i].style.top = `${p.y / DPR}px`; elements[i].firstChild.style.transform = `rotate(${angle}rad)`; });
      forkPlace();
    }
  };
}

</script>
<script type="module" src="d04-client.mjs"></script>
<script type="module" src="solo-client.mjs"></script>
